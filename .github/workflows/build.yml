name: Build Libryno

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller requests-sse

      - name: Build executable
        run: pyinstaller build.spec --clean --noconfirm --onefile --name="Libryno-Setup"

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: libryno-windows
          path: dist/Libryno-Setup.exe

      - name: Create release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF#refs/tags/}" \
            dist/Libryno-Setup.exe \
            --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libgl1-mesa-glx

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller requests-sse

      - name: Build executable
        run: pyinstaller build.spec --clean --noconfirm --onefile

      - name: Create .deb package
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/256x256/apps
          cp dist/LIBRYNO package/usr/bin/libryno
          cp packaging/libryno.desktop package/usr/share/applications/
          cp img/logo.png package/usr/share/icons/hicolor/256x256/apps/libryno.png
          cat > package/DEBIAN/control << EOF
          Package: libryno
          Version: 2.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: OrdoB <suporte@ordob.com>
          Description: Sistema de Gestão de Biblioteca Pública
          Depends: libglib2.0-0
          EOF
          dpkg-deb --build package libryno-linux-x64.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libryno-linux
          path: |
            dist/LIBRYNO
            libryno-linux-x64.deb

      - name: Create AppImage
        run: |
          cat > AppRun << 'EOF'
          #!/bin/bash
          exec "$(dirname "$0")/Libryno" "$@"
          EOF
          chmod +x AppRun
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp dist/LIBRYNO AppDir/usr/bin/Libryno
          cp AppRun AppDir/AppRun
          cp img/logo.png AppDir/libryno.png
          cat > AppDir/libryno.desktop << EOF
          [Desktop Entry]
          Name=Libryno
          Exec=Libryno
          Icon=libryno
          Type=Application
          Categories=Utility;Office;
          EOF
          ./appimagetool-x86_64.AppImage AppDir libryno-linux-x64.AppImage
          chmod +x libryno-linux-x64.AppImage

      - name: Create release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF#refs/tags/}" \
            libryno-linux-x64.deb \
            libryno-linux-x64.AppImage \
            --clobber
